name: Build APK (Auto-Generate Project)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ============================================================
      # 生成整个项目源码（会覆盖仓库中同名文件）
      # ============================================================
      - name: Generate project files
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/example/etsanswer

          # ---------- settings.gradle ----------
          cat > settings.gradle << 'EOF'
          include ':app'
          rootProject.name = "ETSAnswer"
EOF

          # ---------- 根 build.gradle ----------
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # ---------- gradle.properties ----------
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # ---------- app/build.gradle ----------
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.example.etsanswer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.etsanswer"
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation("com.indidevs.android:adbeesh:0.1.0-beta-1")
              implementation("com.flyfishxu:kadb:2.1.5")
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          }
          EOF

          # ---------- AndroidManifest.xml ----------
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="ETS答案"
                  android:allowBackup="false"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.indidevs.android.adbeesh.pairing.AdbPairingService"
                      android:foregroundServiceType="connectedDevice"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # ---------- SettingConfig.kt ----------
          cat > app/src/main/java/com/example/etsanswer/SettingConfig.kt << 'EOF'
          package com.example.etsanswer

          object SettingConfig {
              val setting: MutableMap<String, MutableMap<String, MutableMap<String, String>>> =
                  mutableMapOf(
                      "class one" to mutableMapOf("output" to mutableMapOf(
                          "number" to "true", "question" to "true",
                          "options" to "true", "answer" to "true")),
                      "class two" to mutableMapOf("output" to mutableMapOf(
                          "number" to "true", "question" to "true",
                          "answer_coming" to "true", "options" to "true", "answer" to "true")),
                      "class three" to mutableMapOf("output" to mutableMapOf(
                          "message" to "true", "number" to "true", "question" to "true",
                          "options" to "true", "answer" to "true")),
