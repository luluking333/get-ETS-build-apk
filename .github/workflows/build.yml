            '                "question"      -> "question: $q"' \
            '                "answer_coming" -> "answer_coming: $coming"' \
            '                "options"       -> "options: $opts"' \
            '                "answer"        -> "answer: $ans"' \
            '                else -> ""' \
            '            }).append("\n")' \
            '        }' \
            '        log(sb.toString())' \
