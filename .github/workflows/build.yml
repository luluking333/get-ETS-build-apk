          # ---------- AdbPairingHelper.kt ----------
          cat > app/src/main/java/com/example/etsanswer/AdbPairingHelper.kt << 'EOF'
          package com.example.etsanswer

          import android.content.Context
          import com.indidevs.android.adbeesh.pairing.AdbPairing
          import com.indidevs.android.adbeesh.pairing.AdbPairingWorkflow
          import com.indidevs.android.adbeesh.pairing.AdbPairingCallback
          import com.indidevs.android.adbeesh.notifications.NotificationCodeProvider
          import com.indidevs.android.adbeesh.notifications.NotificationFlowConfig
          import com.indidevs.android.adbeesh.notifications.NotificationCallback
          import com.indidevs.android.adbeesh.config.AdbSessionConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.GlobalScope
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          object AdbPairingHelper {

              @Volatile var isPaired = false; private set

              private lateinit var pairing: AdbPairing

              /**
               * 启动配对工作流（必须在主线程调用）。
               * ensurePaired 内部会判断是否已配对，已配对则直接返回。
               */
              fun startPairing(context: Context, onResult: (Boolean) -> Unit) {
                  val sessionConfig = AdbSessionConfig.Builder()
                      .identityName("ETSAnswer")
                      .build()

                  val flowConfig = NotificationFlowConfig.Builder()
                      .channel(id = "ets_pairing", name = "ETS 配对")
                      .build()

                  pairing = AdbPairing.get(context, id = "main", config = sessionConfig)

                  val workflow = AdbPairingWorkflow.Builder()
                      .withCodeProvider(NotificationCodeProvider(context, flowConfig))
                      .addCallback(NotificationCallback(context, flowConfig))
                      .addCallback(object : AdbPairingCallback {
                          override fun onPairingSuccess(sessionId: String) {
                              isPaired = true
                              onResult(true)
                          }
                          override fun onPairingError(sessionId: String, error: String) {
                              isPaired = false
                              onResult(false)
                          }
                          override fun onPairingStarted(sessionId: String) {}
                          override fun onPortFound(sessionId: String, port: Int) {}
                          override fun onPairingHandshakeStarted(sessionId: String) {}
                      })
                      .build()

                  GlobalScope.launch(Dispatchers.Main) {
                      try {
                          pairing.ensurePaired(workflow)
                      } catch (e: Exception) {
                          isPaired = false
                          onResult(false)
                      }
                  }
              }

              /**
               * 执行 shell 命令（suspend）。
               * 每次 openSession().use { } 自动关闭会话，避免连接泄漏。
               */
              suspend fun runShell(command: String): String = withContext(Dispatchers.IO) {
                  if (!isPaired) throw IllegalStateException("ADB 未配对，请先完成无线调试配对")

                  pairing.openSession(timeoutMs = 10000).use { session ->
                      if (!session.isAlive()) {
                          throw IllegalStateException("ADB 会话已失效")
                      }
                      val result = session.shell(command)
                      if (!result.isSuccess) {
                          throw RuntimeException(result.error ?: "shell exit ${result.exitCode}")
                      }
                      result.output
                  }
              }

              fun reset() { isPaired = false }
              fun release() { reset() }
          }
          EOF

          # ---------- EtsAnswerEngine.kt ----------
          cat > app/src/main/java/com/example/etsanswer/EtsAnswerEngine.kt << 'EOF'
          package com.example.etsanswer

          import com.google.gson.JsonArray
          import com.google.gson.JsonElement
          import com.google.gson.JsonObject
          import com.google.gson.JsonParser
          import com.google.gson.JsonPrimitive
          import kotlinx.coroutines.runBlocking

          class EtsAnswerEngine(
              private val log: (String) -> Unit
          ) {
              companion object {
                  private const val BASE =
                      "/storage/emulated/0/Android/data/com.ets100.secondary/files/Download/ETS_secondary/resource"
              }

              val answers = mutableListOf<JsonObject>()
              private val contentPaths = mutableListOf<String>()

              private fun runShell(command: String): String {
                  return runBlocking { AdbPairingHelper.runShell(command) }
              }

              fun loadAnswers() {
                  contentPaths.clear(); answers.clear()

                  var files: List<String> = emptyList()
                  var thinks = 0
                  while (true) {
                      try {
                          val raw = runShell("cd $BASE && find -name 'content2.json'")
                          files = raw.trim().split("\n").filter { it.isNotBlank() }
                          if (files.isNotEmpty()) break
                          throw RuntimeException("empty")
                      } catch (e: Exception) {
                          thinks++
                          if (thinks >= 10) {
                              log("你的文件似乎损坏了")
                              return
                          }
                          log("获取失败，正在重试（$thinks/10）")
                      }
                  }

                  files.forEachIndexed { i, f ->
                      val clean = f.removePrefix("./")
                      contentPaths.add(clean.removeSuffix("/content2.json"))
                      try {
                          val txt = runShell("cat '$BASE/$clean'")
                          val json = JsonParser.parseString(txt).asJsonObject
                          answers.add(processJson(json))
                          log("获取 ${i + 1}/${files.size} 中...")
                      } catch (e: Exception) {
                          log("第 ${i + 1} 套解析失败：${e.message}")
                      }
                  }
                  log("获取完毕（成功 ${answers.size}/${files.size} 套）")
              }

              private fun processJson(obj: JsonObject): JsonObject {
                  val info = obj.getAsJsonObject("info")
                  val xtnr = info?.get("xt_nr")?.takeIf { it.isJsonPrimitive }?.asString ?: ""
                  if (xtnr.isEmpty()) return obj

                  val result = replaceBrs(obj) as JsonObject
                  try {
                      val newInfo = result.getAsJsonObject("info")
                      val t = newInfo.get("xt_nr").asString
                      newInfo.addProperty("xt_nr", t.replace("</p>", "").replace("<p>", ""))
                  } catch (_: Exception) {}
                  return result
              }

              private fun replaceBrs(e: JsonElement): JsonElement = when {
                  e.isJsonPrimitive && e.asJsonPrimitive.isString ->
                      JsonPrimitive(e.asString.replace("</br>", "\n"))
                  e.isJsonObject -> JsonObject().also { o ->
                      e.asJsonObject.entrySet().forEach { (k, v) -> o.add(k, replaceBrs(v)) }
                  }
                  e.isJsonArray -> JsonArray().also { a ->
                      e.asJsonArray.forEach { a.add(replaceBrs(it)) }
                  }
                  else -> e
              }

              private fun inferClass(group: JsonObject): String {
                  val st = group.get("structure_type")?.asString ?: ""
                  val info = group.getAsJsonObject("info") ?: return "class one"
                  if (st == "collector.fill") return "class four"
                  val hasText = (info.get("st_nr")?.takeIf { it.isJsonPrimitive }?.asString ?: "").isNotBlank() ||
                                (info.get("value")?.takeIf { it.isJsonPrimitive }?.asString ?: "").isNotBlank()
                  if (hasText) return "class three"
                  val xts = info.getAsJsonArray("xtlist") ?: return "class one"
                  for (q in xts) {
                      val opts = q.asJsonObject.getAsJsonArray("xxlist") ?: continue
                      for (o in opts) {
                          if ((o.asJsonObject.get("xx_wj")?.takeIf { it.isJsonPrimitive }?.asString ?: "")
                                  .endsWith(".jpg")) return "class two"
                      }
                  }
                  return "class one"
              }

              private fun parseFilter(input: String?): Set<Int>? {
                  if (input.isNullOrBlank() || input == "all") return null
                  val set = mutableSetOf<Int>()
                  input.replace(" ", "").split(",").forEach { p ->
                      if (p.isBlank()) return@forEach
                      if (p.contains("-")) {
                          val parts = p.split("-")
                          if (parts.size == 2) set.addAll(parts[0].toInt()..parts[1].toInt())
                          else throw IllegalArgumentException("bad range: $p")
                      } else set.add(p.toInt())
                  }
                  return set
              }

              fun printAnswers(questions: String? = "all") {
                  val filter = parseFilter(questions)
                  val setting = SettingConfig.setting
                  val order = listOf("message", "number", "question", "answer_coming", "options", "answer")

                  var total = 0
                  answers.forEach { g ->
                      val info = g.getAsJsonObject("info")
                      when (g.get("structure_type")?.asString) {
                          "collector.choose" -> total += (info?.getAsJsonArray("xtlist")?.size() ?: 0)
                          "collector.fill"   -> total += (info?.getAsJsonArray("std")?.size() ?: 0)
                      }
                  }
                  log("共 $total 题\n")

                  answers.forEach { group ->
                      val cls = inferClass(group)
                      val cfg = setting[cls]?.get("output") ?: emptyMap()
                      val info = group.getAsJsonObject("info") ?: return@forEach
                      val globalText = (info.get("st_nr")?.takeIf { it.isJsonPrimitive }?.asString ?: "")
                          .ifBlank { info.get("value")?.takeIf { it.isJsonPrimitive }?.asString ?: "" }
                          .trim()

                      when (group.get("structure_type")?.asString) {
                          "collector.choose" -> {
                              info.getAsJsonArray("xtlist")?.forEach { qElem ->
                                  val q = qElem.asJsonObject
                                  val raw = q.get("xt_nr")?.takeIf { it.isJsonPrimitive }?.asString?.trim() ?: ""
                                  val num = Regex("^\\d+").find(raw)?.value?.toIntOrNull()
                                  if (filter != null && num !in filter) return@forEach

                                  val (number, questionText) = if ('.' in raw) {
                                      val parts = raw.split(".", limit = 2)
                                      (parts[0] + ".") to (parts.getOrNull(1)?.trim() ?: "")
                                  } else raw to ""

                                  val qText = questionText.ifBlank {
                                      q.get("xt_value")?.takeIf { it.isJsonPrimitive }?.asString ?: ""
                                  }

                                  val optsStr = (q.getAsJsonArray("xxlist") ?: JsonArray()).joinToString(" | ") { o ->
                                      val oo = o.asJsonObject
                                      val text = (oo.get("xx_nr")?.takeIf { it.isJsonPrimitive }?.asString ?: "")
                                          .trim().ifBlank {
                                              val wj = oo.get("xx_wj")?.takeIf { it.isJsonPrimitive }?.asString ?: ""
                                              if (wj.isNotBlank()) "[图片: $wj]" else ""
                                          }
                                      "${oo.get("xx_mc")?.takeIf { it.isJsonPrimitive }?.asString ?: ""}. $text"
                                  }

                                  val ans = q.get("answer")?.takeIf { it.isJsonPrimitive }?.asString ?: ""
                                  emitFields(order, cfg, globalText, number, qText, "(choose)", optsStr, ans)
                              }
                          }
                          "collector.fill" -> {
                              info.getAsJsonArray("std")?.forEach { item ->
                                  val it = item.asJsonObject
                                  val n = it.get("th")?.takeIf { it.isJsonPrimitive }?.asInt ?: 0
                                  if (filter != null && n !in filter) return@forEach
                                  val number = "$n."
                                  val ans = (it.get("value")?.takeIf { it.isJsonPrimitive }?.asString ?: "")
                                      .split("/")[0]
                                  emitFields(order, cfg, globalText, number, "", "(fill)", "", ans)
                              }
                          }
                      }
                  }
              }

              private fun emitFields(
                  order: List<String>, cfg: Map<String, String>,
                  msg: String, number: String, q: String, coming: String, opts: String, ans: String
              ) {
                  val sb = StringBuilder()
                  order.forEach { f ->
                      if (cfg[f] != "true") return@forEach
                      sb.append(when (f) {
                          "message"       -> "message: $msg"
                          "number"        -> "number: $number"
                          "question"      -> "question: $q"
                          "answer_coming" -> "answer_coming: $coming"
                          "options"       -> "options: $opts"
                          "answer"        -> "answer: $ans"
                          else -> ""
                      }).append("\n")
                  }
                  log(sb.toString())
              }

              fun showFields() {
                  val map = mutableMapOf<String, MutableSet<String>>()
                  SettingConfig.setting.forEach { (_, cfg) ->
                      cfg["output"]?.forEach { (k, v) -> map.getOrPut(k) { mutableSetOf() }.add(v) }
                  }
                  val sb = StringBuilder()
                  map.forEach { (f, vals) ->
                      sb.append("$f: ").append(if (vals.size == 1) vals.first() else "不一致 $vals").append("\n")
                  }
                  log(sb.toString())
              }

              fun setOpt(field: String, value: String) {
                  var hit = false
                  SettingConfig.setting.values.forEach { cfg ->
                      cfg["output"]?.let { if (it.containsKey(field)) { it[field] = value; hit = true } }
                  }
                  log(if (hit) "已设置 $field = $value" else "字段不存在：$field")
              }

              fun removeAnswer(silent: Boolean = false) {
                  answers.clear()
                  if (!silent) log("已移除本地答案")
              }

              fun removeOldTest() {
var ok=0
                  contentPaths.forEach { p ->
                      try {
                          runShell("rm -rf '$BASE/$p'")
好的++
                      } catch (e: Exception) {
                          log("删除 $p 失败：${e.message}")
                      }
                  }
                  log("已移除 $ok/${contentPaths.size} 套旧试卷")
contentPaths.clear()
              }
          }
