            '        }' \
            '        log(if (hit) "已设置 $field = $value" else "字段不存在：$field")' \
            '    }' \
            '' \
            '    fun removeAnswer(silent: Boolean = false) {' \
            '        answers.clear()' \
            '        if (!silent) log("已移除本地答案")' \
            '    }' \
            '' \
            '    fun removeOldTest() {' \
            '        var ok = 0' \
            '        contentPaths.forEach { p ->' \
            '            try {' \
            '                runShell("rm -rf '\''$BASE/$p'\''")' \
            '                ok++' \
            '            } catch (e: Exception) {' \
            '                log("删除 $p 失败：${e.message}")' \
            '            }' \
            '        }' \
            '        log("已移除 $ok/${contentPaths.size} 套旧试卷")' \
            '        contentPaths.clear()' \
            '    }' \
            '}' \
            > app/src/main/java/com/example/etsanswer/EtsAnswerEngine.kt

      - name: Generate MainActivity.kt
        run: |
          printf '%s\n' \
            'package com.example.etsanswer' \
            '' \
            'import android.Manifest' \
            'import android.os.Build' \
            'import android.os.Bundle' \
            'import android.text.method.ScrollingMovementMethod' \
            'import android.widget.*' \
            'import androidx.appcompat.app.AlertDialog' \
            'import androidx.appcompat.app.AppCompatActivity' \
            'import androidx.core.app.ActivityCompat' \
            'import androidx.core.view.setPadding' \
            '' \
            'class MainActivity : AppCompatActivity() {' \
            '' \
            '    private lateinit var logView: TextView' \
            '    private lateinit var statusView: TextView' \
            '    private lateinit var scrollView: ScrollView' \
            '    private lateinit var engine: EtsAnswerEngine' \
            '    private lateinit var pairingBtn: Button' \
            '    private val logBuf = StringBuilder()' \
            '' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '' \
            '        if (Build.VERSION.SDK_INT >= 33) {' \
            '            ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)' \
            '        }' \
            '' \
            '        val root = LinearLayout(this).apply {' \
            '            orientation = LinearLayout.VERTICAL' \
            '            setPadding(24)' \
            '        }' \
            '' \
            '        statusView = TextView(this).apply {' \
            '            textSize = 13f' \
            '            setTextColor(0xFF00FF88.toInt())' \
            '            text = "ADB：未配对"' \
            '        }' \
            '' \
            '        logView = TextView(this).apply {' \
            '            textSize = 13f' \
            '            typeface = android.graphics.Typeface.MONOSPACE' \
            '            movementMethod = ScrollingMovementMethod()' \
            '            setTextColor(0xFFE0E0E0.toInt())' \
            '            setBackgroundColor(0xFF1A1A1A.toInt())' \
            '            setPadding(16)' \
            '        }' \
            '        scrollView = ScrollView(this).apply { addView(logView) }' \
            '' \
            '        root.addView(statusView)' \
            '        root.addView(scrollView, LinearLayout.LayoutParams(-1, 0, 1f))' \
            '' \
            '        pairingBtn = Button(this).apply {' \
            '            text = "开始无线调试配对"' \
            '            layoutParams = LinearLayout.LayoutParams(-1, -2)' \
            '            setOnClickListener { startPairing() }' \
            '        }' \
            '        root.addView(pairingBtn)' \
